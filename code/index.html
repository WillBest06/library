<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="scripts.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="book-form-container">
        <form action="" method="get" class="book-form">
          <div class="form-item">
            <label for="title">Title:</label>
            <input
              type="text"
              name="title"
              id="title"
              placeholder="Book title"
              required
            />
          </div>

          <div class="form-item">
            <label for="author">Author:</label>
            <input
              type="text"
              name="author"
              id="author"
              placeholder="Book author"
              required
            />
          </div>

          <div class="form-item">
            <label for="pages">Number of pages:</label>
            <input
              type="number"
              name="pages"
              id="pages"
              placeholder="Number of pages"
              min="0"
              value="0"
              required
            />
          </div>

          <div class="form-item">
            <label for="read-status">Have you read this book?</label>
            <input type="checkbox" name="read-status" id="read-status" />
          </div>

          <button class="submit">Submit</button>
        </form>
      </div>

      <div class="books">
        <table class="book-table">
          <thead>
            <th>Title</th>
            <th>Author</th>
            <th>Pages</th>
            <th>Read it?</th>
            <th>Delete</th>
          </thead>
          <tbody class="BT-body"></tbody>
        </table>
      </div>
    </div>
  </body>
</html>
